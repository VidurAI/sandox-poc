apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ include "sandbox.namespace" . }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ include "sandbox.namespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ include "sandbox.namespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        {{- include "sandbox.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.app.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.app.stack "python-web" }}
          command: ["uvicorn"]
          args: ["{{ .Values.app.entrypoint }}", "--host", "0.0.0.0", "--port", "{{ .Values.app.port }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            {{- if .Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-db
                  key: url
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: {{ eq .Values.app.stack "static" | ternary "/" "/healthz" | quote }}, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: {{ eq .Values.app.stack "static" | ternary "/" "/healthz" | quote }}, port: http }
            initialDelaySeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq .Values.app.stack "static" }}
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if eq .Values.app.stack "static" }}
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        {{- end }}
