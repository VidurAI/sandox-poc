apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: {{ include "sandbox.namespace" . }}
spec:
  hard:
    {{- toYaml .Values.platform.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: {{ include "sandbox.namespace" . }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.platform.resources.limits | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.platform.resources.requests | nindent 8 }}
